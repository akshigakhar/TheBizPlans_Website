<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Canadian small business loan approval rates by lender</title><desc id="desc">Horizontal bars show Desjardins 91 percent, National Bank 89 percent, RBC 85 percent, CIBC 71 percent, and ATB Financial 65 percent.</desc><rect width="960" height="560" fill="#f5f7f8"/><text x="55" y="58" font-family="Arial" font-size="29" font-weight="700" fill="#173b57">Small-business loan approval rates</text><text x="55" y="88" font-family="Arial" font-size="17" fill="#52616b">Reported by CFIB, October 2025</text><g font-family="Arial" font-size="20" fill="#173b57"><text x="55" y="155">Desjardins</text><text x="55" y="235">National Bank</text><text x="55" y="315">RBC</text><text x="55" y="395">CIBC</text><text x="55" y="475">ATB Financial</text></g><g fill="#1d7182"><rect x="235" y="128" width="591" height="38" rx="6"/><rect x="235" y="208" width="578" height="38" rx="6"/><rect x="235" y="288" width="552" height="38" rx="6"/><rect x="235" y="368" width="461" height="38" rx="6"/><rect x="235" y="448" width="422" height="38" rx="6"/></g><g font-family="Arial" font-size="20" font-weight="700" fill="#173b57"><text x="840" y="155">91%</text><text x="827" y="235">89%</text><text x="801" y="315">85%</text><text x="710" y="395">71%</text><text x="671" y="475">65%</text></g><text x="55" y="530" font-family="Arial" font-size="15" fill="#52616b">Source: CFIB submission to the Competition Bureau (Oct 2025)</text></svg>
